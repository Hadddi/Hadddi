<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مدیریت کلاس من</title>

<meta name="theme-color" content="#1F3A5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="کلاس من">


<style>
:root{
 --paper:#FAF6EC; --panel:#FFFCF6; --panel-2:#FFF9EE;
 --ink:#26293A; --muted:#79705D;
 --navy:#1F3A5C; --navy-dk:#152A44;
 --brass:#B8863B; --brass-soft:#F1E4C8; --brass-line:#E6DCC3;
 --danger:#9B3242; --danger-soft:#F5DEDF;
 --success:#3F6C51; --success-soft:#DEEBE0;
 --warning:#9C6B1F; --warning-soft:#F5E6C8;
 --radius:12px; --shadow:0 3px 14px -4px rgba(38,41,58,.13), 0 1px 2px rgba(38,41,58,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Vazirmatn',Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Noto Serif','Vazirmatn',serif;font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 18px;font-weight:600;transition:transform .12s ease,box-shadow .12s ease,background-color .12s ease;letter-spacing:0}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{display:flex;min-height:100vh}
.sidebar{width:236px;background:var(--navy);border-left:3px solid var(--brass);padding:24px 18px;position:fixed;right:0;top:0;bottom:0;display:flex;flex-direction:column;color:#EFE7D6}
.logo{font-family:'Noto Serif',serif;font-size:19px;font-weight:700;margin-bottom:2px;color:#fff;display:flex;align-items:center;gap:9px}
.logo-tag{font-size:11.5px;color:#B9C4D2;margin-bottom:26px;padding-right:29px;letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:transparent;color:#D7DEE8;padding:12px 14px;border-radius:9px;border-inline-end:3px solid transparent;font-weight:500}
.nav button.active{background:rgba(184,134,59,.16);color:#fff;border-inline-end-color:var(--brass);font-weight:700}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.sidebar-foot{margin-top:auto;padding-right:8px;font-size:11px;color:#8493A6;line-height:1.7}

.main{margin-right:236px;width:calc(100% - 236px);padding:28px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px}
h1{font-size:26px;margin:0 0 4px;color:var(--ink)}
h2{font-size:18px;margin:0 0 2px;color:var(--ink)}
.muted{color:var(--muted);font-size:14px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card,.panel{background:var(--panel);border:1px solid var(--brass-line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative}
.panel{padding:20px}
.panel>h2:first-child,.panel>.top:first-child{position:relative;padding-right:13px}
.panel>h2:first-child:before{content:"";position:absolute;right:0;top:2px;bottom:2px;width:3px;background:var(--brass);border-radius:2px}
.number{font-size:30px;font-weight:800;margin-top:10px;color:var(--navy);font-family:'Noto Serif',serif}
.card{transition:transform .15s ease,box-shadow .15s ease}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px}

.primary{background:var(--navy);color:#fff;box-shadow:0 2px 8px -2px rgba(31,58,92,.5)}
.primary:hover{background:var(--navy-dk)}
.secondary{background:var(--brass-soft);color:#6B4E1E}
.secondary:hover{background:#EAD9AE}
.danger{background:var(--danger-soft);color:var(--danger)}
.danger:hover{background:#F0CBCD}
.success{background:var(--success-soft);color:var(--success)}
.warning{background:var(--warning-soft);color:var(--warning)}

table{width:100%;border-collapse:collapse}
th,td{padding:12px 11px;border-bottom:1px solid var(--brass-line);text-align:right;font-size:14.5px}
th{background:var(--panel-2);color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.02em}
tbody tr{transition:background-color .1s ease}
tbody tr:hover{background:var(--panel-2)}

input,select{width:100%;padding:11px 12px;border:1px solid #DCD2B8;border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--brass)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field label{display:block;margin-bottom:6px;font-size:13.5px;color:var(--muted);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.modal{position:fixed;inset:0;background:rgba(31,26,15,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:999;backdrop-filter:blur(1.5px)}
.modal.show{display:flex;animation:fadeIn .15s ease}
.modalbox{background:var(--panel);border-radius:18px;padding:24px;max-width:700px;width:100%;max-height:90vh;overflow:auto;border:1px solid var(--brass-line);box-shadow:0 20px 50px -12px rgba(20,20,30,.35);animation:riseIn .18s cubic-bezier(.2,.8,.3,1)}
.empty{padding:34px;text-align:center;color:var(--muted);background:repeating-linear-gradient(to bottom,transparent,transparent 27px,var(--brass-line) 28px);border-radius:10px}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes riseIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

@media(max-width:800px){
 .sidebar{width:72px;padding:16px 10px}
 .logo{font-size:0}.logo:after{content:"📚";font-size:24px}
 .logo-tag{display:none}
 .nav button{font-size:0;justify-content:center;padding:13px 0;border-inline-end:none;border-bottom:3px solid transparent}
 .nav button.active{border-bottom-color:var(--brass);border-inline-end-color:transparent}
 .nav button:before{font-size:19px}
 .nav button:nth-child(1):before{content:"🏠"}.nav button:nth-child(2):before{content:"📚"}.nav button:nth-child(3):before{content:"👥"}.nav button:nth-child(4):before{content:"📝"}.nav button:nth-child(5):before{content:"📊"}
 .sidebar-foot{display:none}
 .main{margin-right:72px;width:calc(100% - 72px);padding:16px}
 .cards{grid-template-columns:repeat(2,1fr)}
 .grid,.formgrid{grid-template-columns:1fr}
 th,td{font-size:13px}
}
input[type="date"]{direction:ltr;text-align:center}
input.score-input{width:100px;text-align:center;font-weight:bold;direction:ltr;padding:8px;font-size:16px;color:var(--navy)}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo">📚 مدیریت کلاس من</div>
<div class="logo-tag">دفتر دیجیتال کلاس</div>
<div class="nav">
<button onclick="show('dashboard')" class="active">🏠 خانه</button>
<button onclick="show('courses')">📚 درس‌ها</button>
<button onclick="show('students')">👥 دانشجویان</button>
<button onclick="show('assignments')">📝 تمرین‌ها</button>
<button onclick="reportsByCourse()">📊 گزارش‌ها</button>
</div>
<div class="sidebar-foot">همه‌ی اطلاعات روی همین دستگاه ذخیره می‌شود.</div>
</aside>
<main class="main" id="main"></main>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>

<script>
const KEY='class_manager_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{courses:[],students:[],attendance:[],assignments:[],sessionScores:[],sessions:[],assignmentScores:[]}; 
if(!db.sessionScores)db.sessionScores=[]; 
if(!db.sessions)db.sessions=[]; 
if(!db.assignments)db.assignments=[]; 
if(!db.assignmentScores)db.assignmentScores=[];

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function genId(){
 try{ if(window.crypto && typeof crypto.randomUUID==='function') return crypto.randomUUID(); }catch(e){}
 return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function today(){return new Date().toISOString().split('T')[0]}

// ============== تبدیل تاریخ میلادی به شمسی ==============
function toJalali(gy, gm, gd) {
    let gdm = [0,31,28,31,30,31,30,31,31,30,31,30,31];
    let gy2 = gy <= 1600 ? gy - 621 : gy - 1600;
    let days = 365 * gy2 + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) + Math.floor((gy2 + 399) / 400) - 80 + gd;
    for (let i = 1; i < gm; i++) days += gdm[i];
    if (gm > 2 && ((gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0)) days++;
    let jy = gy <= 1600 ? 0 : 979;
    jy += 33 * Math.floor(days / 12053);
    days %= 12053;
    jy += 4 * Math.floor(days / 1461);
    days %= 1461;
    if (days > 365) {
        jy += Math.floor((days - 1) / 365);
        days = (days - 1) % 365;
    }
    let jm = days < 186 ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
    let jd = 1 + (days < 186 ? days % 31 : (days - 186) % 30);
    return [jy, jm, jd];
}

function formatJalali(dateStr) {
    if(!dateStr) return '';
    const parts = dateStr.split('-');
    const y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
    const j = toJalali(y, m, d);
    const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
    return `${j[0]}/${String(j[1]).padStart(2,'0')}/${String(j[2]).padStart(2,'0')} (${months[j[1]-1]})`;
}

function show(page){
 document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',['dashboard','courses','students','assignments','reports'][i]===page));
 const m=document.getElementById('main');
 if(page==='dashboard') dashboard(m);
 if(page==='courses') courses(m);
 if(page==='students') students(m);
 if(page==='assignments') assignments(m);
 if(page==='reports') reportsByCourse();
}

function dashboard(m){
 const totalStudents=db.students.length, totalCourses=db.courses.length;
 m.innerHTML=`<div class="top"><div><h1>سلام استاد 👋</h1><div class="muted">امروز ${formatJalali(today())}</div></div><button class="primary" onclick="newCourse()">＋ درس جدید</button></div>
 <div class="cards"><div class="card">📚 درس‌ها<div class="number">${totalCourses}</div></div><div class="card">👥 دانشجویان<div class="number">${totalStudents}</div></div><div class="card">📅 جلسات ثبت‌شده<div class="number">${new Set(db.attendance.map(x=>x.session)).size}</div></div><div class="card">📝 تمرین‌ها<div class="number">${db.assignments.length}</div></div></div>
 <div class="grid"><div class="panel"><h2>📚 درس‌های من</h2>${db.courses.length?db.courses.map(c=>`<div class="card" style="margin:8px 0"><b>${esc(c.name)}</b><div class="muted">${esc(c.term||'')} — ${db.students.filter(s=>s.courseId==c.id).length} دانشجو</div></div>`).join(''):'<div class="empty">هنوز درسی ایجاد نشده است.</div>'}</div>
 <div class="panel"><h2>📝 تمرین‌های اخیر</h2>${db.assignments.length?db.assignments.slice(-5).reverse().map(a=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${esc(a.title)}</b><div class="muted">${formatJalali(a.dueDate)||'بدون مهلت'}</div></div>`).join(''):'<div class="empty">تمرینی ثبت نشده است.</div>'}</div></div>`;
}

function courses(m){
 m.innerHTML=`<div class="top"><div><h1>📚 درس‌های من</h1><div class="muted">مدیریت کلاس‌ها</div></div><button class="primary" onclick="newCourse()">＋ ایجاد درس</button></div>
 <div class="grid">${db.courses.map(c=>`<div class="panel"><h2>📖 ${esc(c.name)}</h2><div class="muted">${esc(c.term||'')} | ${db.students.filter(s=>s.courseId==c.id).length} دانشجو</div><div class="actions" style="margin-top:14px"><button class="primary" onclick="courseSessions('${c.id}')">📅 جلسات</button><button class="secondary" onclick="courseAssignments('${c.id}')">📝 تمرین‌ها</button><button class="secondary" onclick="courseStudents('${c.id}')">👥 دانشجویان</button><button class="danger" onclick="deleteCourse('${c.id}')">🗑 حذف</button></div></div>`).join('')||'<div class="panel empty">درسی ندارید. از «ایجاد درس» شروع کنید.</div>'}</div>`;
}

function newCourse(){
 modal(`<h2>📚 ایجاد درس</h2><div class="formgrid"><div class="field"><label>نام درس</label><input id="cname"></div><div class="field"><label>ترم</label><input id="cterm" placeholder="مثلاً ترم اول ۱۴۰۵"></div><div class="field"><label>تعداد واحد</label><input id="units" type="number" value="3"></div><div class="field"><label>روز و ساعت</label><input id="schedule" placeholder="مثلاً شنبه ۱۰ تا ۱۲"></div></div><div class="actions" style="margin-top:18px"><button class="primary" onclick="addCourse()">✅ ذخیره</button><button onclick="closeModal()">❌ انصراف</button></div>`)
}

function addCourse(){const name=document.getElementById('cname').value.trim();if(!name)return alert('نام درس را وارد کنید');db.courses.push({id:genId(),name,term:document.getElementById('cterm').value,units:document.getElementById('units').value,schedule:document.getElementById('schedule').value});save();closeModal();show('courses')}
function deleteCourse(id){if(confirm('این درس و اطلاعات مرتبط با آن حذف شود؟')){db.courses=db.courses.filter(c=>c.id!==id);db.students=db.students.filter(s=>s.courseId!==id);save();show('courses')}}
function students(m){m.innerHTML=studentPage()}
function studentPage(courseId=''){const list=db.students.filter(s=>!courseId||s.courseId===courseId);return `<div class="top"><div><h1>👥 دانشجویان</h1><div class="muted">${list.length} نفر</div></div><div class="actions"><button class="secondary" onclick="importCSV()">📤 ورود CSV</button><button class="primary" onclick="newStudent('${courseId}')">＋ دانشجو</button></div></div><div class="panel">${list.length?`<table><thead><tr><th>نام</th><th>شماره دانشجویی</th><th>درس</th><th>عملیات</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.sid||'')}</td><td>${esc(db.courses.find(c=>c.id===s.courseId)?.name||'')}</td><td><button class="danger" onclick="deleteStudent('${s.id}')">🗑 حذف</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">هنوز دانشجویی ثبت نشده است.</div>'}</div>`}
function newStudent(courseId=''){modal(`<h2>👤 افزودن دانشجو</h2><div class="formgrid"><div class="field"><label>نام و نام خانوادگی</label><input id="sname"></div><div class="field"><label>شماره دانشجویی</label><input id="sid"></div><div class="field"><label>درس</label><select id="scourse">${db.courses.map(c=>`<option value="${c.id}" ${c.id===courseId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div></div><div class="actions" style="margin-top:18px"><button class="primary" onclick="addStudent()">✅ ذخیره</button><button onclick="closeModal()">❌ انصراف</button></div>`)}
function addStudent(){const name=document.getElementById('sname').value.trim(),sid=document.getElementById('sid').value.trim(),courseId=document.getElementById('scourse').value;if(!name||!courseId)return alert('نام و درس را وارد کنید');db.students.push({id:genId(),name,sid,courseId});save();closeModal();show('students')}
function deleteStudent(id){if(confirm('دانشجو حذف شود؟')){db.students=db.students.filter(s=>s.id!==id);save();show('students')}}
function courseStudents(id){show('students');setTimeout(()=>document.getElementById('main').innerHTML=studentPage(id),0)}

function importCSV(){
 modal(`<h2>📤 ورود دانشجویان</h2>
 <div class="field"><label>درس مقصد</label><select id="importCourse">${db.courses.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
 <div class="field" style="margin-top:14px"><label>📄 فایل CSV</label><input id="studentFile" type="file" accept=".csv,text/csv"></div>
 <div class="muted" style="margin-top:10px">فایل CSV با دو ستون «نام و نام خانوادگی» و «شماره دانشجویی»</div>
 <div class="actions" style="margin-top:18px"><button class="primary" onclick="processStudentFile()">✅ وارد کردن</button><button onclick="closeModal()">❌ انصراف</button></div>`)
}

function processStudentFile(){
 const f=document.getElementById('studentFile').files[0], courseId=document.getElementById('importCourse').value;
 if(!f)return alert('فایل CSV را انتخاب کنید');
 const reader=new FileReader();
 reader.onload=e=>{
  const lines=e.target.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
  if(lines.length<2)return alert('فایل خالی است یا ردیف عنوان ندارد.');
  const headers=lines[0].split(',').map(x=>x.trim().replace(/^"|"$/g,''));
  const ni=headers.findIndex(x=>x==='نام و نام خانوادگی'||x==='نام');
  const si=headers.findIndex(x=>x==='شماره دانشجویی'||x==='شماره');
  if(ni<0)return alert('ستون نام و نام خانوادگی پیدا نشد.');
  let count=0;
  lines.slice(1).forEach(line=>{
   const a=line.split(',').map(x=>x.trim().replace(/^"|"$/g,''));
   const name=(a[ni]||'').trim(), sid=si>=0?(a[si]||'').trim():'';
   if(name && !db.students.some(s=>s.courseId===courseId && ((sid&&s.sid===sid)||s.name===name))){
    db.students.push({id:String(Date.now()+Math.random()),name,sid,courseId}); count++;
   }
  });
  save();closeModal();show('students');alert(`${count} دانشجو وارد شد.`);
 };
 reader.readAsText(f,'UTF-8')
}

function assignments(m){
 const groups=db.courses.map(c=>{
  const list=db.assignments.filter(a=>a.courseId===c.id).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
  return `<div class="panel"><div class="top" style="margin-bottom:10px"><div><h2>📖 ${esc(c.name)}</h2><div class="muted">${list.length} تمرین</div></div><button class="primary" onclick="newAssignment('${c.id}')">＋ تمرین جدید</button></div>
  ${list.length?`<table><thead><tr><th>عنوان</th><th>تاریخ تحویل</th><th>نمره از</th><th>عملیات</th></tr></thead><tbody>${list.map(a=>`<tr><td>${esc(a.title)}</td><td>${formatJalali(a.dueDate)}</td><td>${a.max}</td><td><button class="secondary" onclick="assignmentGrades('${a.id}')">📊 نمرات</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">برای این کلاس هنوز تمرینی ثبت نشده است.</div>'}</div>`;
 }).join('');
 m.innerHTML=`<div class="top"><div><h1>📝 تمرین‌ها</h1><div class="muted">تمرین‌ها به تفکیک کلاس</div></div></div>${groups||'<div class="empty">ابتدا یک درس ایجاد کنید.</div>'}`;
}

function courseAssignments(courseId){
 const c=db.courses.find(x=>x.id===courseId), list=db.assignments.filter(a=>a.courseId===courseId).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
 document.getElementById('main').innerHTML=`<div class="top"><div><h1>📝 تمرین‌ها — ${esc(c.name)}</h1><div class="muted">تکالیف و نمرات دانشجویان</div></div><div class="actions"><button class="secondary" onclick="show('courses')">🔙 بازگشت</button><button class="primary" onclick="newAssignment('${courseId}')">＋ تمرین جدید</button></div></div>
 <div class="panel">${list.length?`<table><thead><tr><th>عنوان</th><th>تاریخ تحویل</th><th>نمره از</th><th>عملیات</th></tr></thead><tbody>${list.map(a=>`<tr><td>${esc(a.title)}</td><td>${formatJalali(a.dueDate)}</td><td>${a.max}</td><td><button class="secondary" onclick="assignmentGrades('${a.id}')">📊 نمرات</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">تمرینی ثبت نشده است.</div>'}</div>`;
}

function newAssignment(courseId){
 modal(`<h2>📝 تمرین جدید</h2><div class="formgrid"><div class="field"><label>عنوان تمرین</label><input id="aTitle" placeholder="تمرین اول"></div><div class="field"><label>تاریخ تحویل</label><input id="aDate" type="date"></div><div class="field"><label>نمره از</label><input id="aMax" type="number" min="1" value="20" step="0.01"></div></div><div class="actions" style="margin-top:18px"><button class="primary" onclick="addAssignment('${courseId}')">✅ ایجاد</button><button onclick="closeModal()">❌ انصراف</button></div>`);
}

function addAssignment(courseId){
 const title=document.getElementById('aTitle').value.trim(), dueDate=document.getElementById('aDate').value, max=Number(document.getElementById('aMax').value)||20;
 if(!title||!dueDate)return alert('عنوان و تاریخ تحویل را وارد کنید');
 db.assignments.push({id:genId(),courseId,title,dueDate,max});save();closeModal();courseAssignments(courseId);
}

// ============== نمرات تمرین (با input text و کیبورد عددی) ==============
function assignmentGrades(assignmentId){
 const a=db.assignments.find(x=>x.id===assignmentId), list=db.students.filter(s=>s.courseId===a.courseId);
 modal(`<h2>📊 نمرات — ${esc(a.title)}</h2><div class="muted">نمره از ${a.max} — با کیبورد عدد وارد کنید (مثل ۱۹.۳۴، ۱۷.۵، ۲۰)</div><div style="max-height:55vh;overflow:auto;margin-top:12px"><table><thead><tr><th>دانشجو</th><th>تحویل</th><th>نمره</th></tr></thead><tbody>${list.map(s=>{const g=db.assignmentScores.find(x=>x.assignmentId===a.id&&x.studentId===s.id);return `<tr><td>${esc(s.name)}</td><td><select onchange="setAssignmentSubmitted('${a.id}','${s.id}',this.value)"><option value="no" ${g?.submitted!==true?'selected':''}>❌ نداده</option><option value="yes" ${g?.submitted===true?'selected':''}>✅ تحویل داده</option></select></td><td><input type="text" inputmode="decimal" value="${g?.score??0}" oninput="setAssignmentScore('${a.id}','${s.id}',this.value)" class="score-input"></td></tr>`}).join('')}</tbody></table></div><div class="actions" style="margin-top:16px"><button class="primary" onclick="save();closeModal();alert('✅ نمرات تمرین ذخیره شد.')">✅ ذخیره</button><button onclick="closeModal()">❌ بستن</button></div>`);
}

function setAssignmentScore(assignmentId,studentId,value){
 let g=db.assignmentScores.find(x=>x.assignmentId===assignmentId&&x.studentId===studentId);
 if(!g){g={assignmentId,studentId,score:0,submitted:false};db.assignmentScores.push(g)}
 const val=parseFloat(value);
 if(!isNaN(val)) g.score=val;
 save();
}

function setAssignmentSubmitted(assignmentId,studentId,value){
 let g=db.assignmentScores.find(x=>x.assignmentId===assignmentId&&x.studentId===studentId);
 if(!g){g={assignmentId,studentId,score:0,submitted:false};db.assignmentScores.push(g)}
 g.submitted=value==='yes';save();
}

// ============== SESSIONS ==============
function courseSessions(courseId){
 const course=db.courses.find(c=>c.id===courseId);
 const list=db.sessions.filter(s=>s.courseId===courseId).sort((a,b)=>a.date.localeCompare(b.date));
 document.getElementById('main').innerHTML=`<div class="top"><div><h1>📖 ${esc(course?.name||'درس')}</h1><div class="muted">📅 جلسات درس</div></div><div class="actions"><button class="secondary" onclick="show('courses')">🔙 بازگشت</button><button class="primary" onclick="newSession('${courseId}')">＋ جلسه جدید</button></div></div>
 <div class="panel">${list.length?`<table><thead><tr><th>جلسه</th><th>تاریخ</th><th>موضوع</th><th>عملیات</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.title)}</td><td>${formatJalali(s.date)}</td><td>${esc(s.topic||'')}</td><td><div class="actions" style="gap:4px"><button class="secondary" onclick="editSession('${s.id}')">✏️ ویرایش</button><button class="secondary" onclick="openSession('${s.id}')">📋 حضور</button><button class="danger" onclick="deleteSession('${s.id}','${s.courseId}')">🗑</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">هنوز جلسه‌ای ایجاد نشده است.</div>'}</div>`;
}

function editSession(sessionId){
 const s=db.sessions.find(x=>x.id===sessionId);
 if(!s) return;
 modal(`<h2>✏️ ویرایش جلسه</h2><div class="formgrid">
 <div class="field"><label>تاریخ جلسه</label><input id="editSessionDate" type="date" value="${s.date}"></div>
 <div class="field"><label>عنوان جلسه</label><input id="editSessionTitle" value="${esc(s.title)}"></div>
 <div class="field" style="grid-column:1/-1"><label>موضوع جلسه</label><input id="editSessionTopic" value="${esc(s.topic||'')}"></div>
 </div><div class="actions" style="margin-top:18px"><button class="primary" onclick="saveEditSession('${sessionId}')">✅ ذخیره تغییرات</button><button onclick="closeModal()">❌ انصراف</button></div>`);
}

function saveEditSession(sessionId){
 const s=db.sessions.find(x=>x.id===sessionId);
 if(!s) return;
 const date=document.getElementById('editSessionDate').value.trim();
 const title=document.getElementById('editSessionTitle').value.trim();
 const topic=document.getElementById('editSessionTopic').value.trim();
 if(!date){alert('تاریخ را انتخاب کنید');return}
 if(!title){alert('عنوان را وارد کنید');return}
 s.date=date; s.title=title; s.topic=topic||'';
 save(); closeModal(); courseSessions(s.courseId);
}

function deleteSession(sessionId,courseId){
 if(!confirm('این جلسه و تمام اطلاعات حضورش حذف شود؟')) return;
 db.sessions=db.sessions.filter(s=>s.id!==sessionId);
 db.attendance=db.attendance.filter(a=>a.session!==sessionId);
 db.sessionScores=db.sessionScores.filter(g=>g.session!==sessionId);
 save();
 courseSessions(courseId);
}

function newSession(courseId){
 modal(`<h2>📅 ایجاد جلسه جدید</h2><div class="formgrid">
 <div class="field"><label>تاریخ جلسه</label><input id="sessionDate" type="date" value="${today()}"></div>
 <div class="field"><label>عنوان جلسه</label><input id="sessionTitle" placeholder="جلسه اول"></div>
 <div class="field" style="grid-column:1/-1"><label>موضوع جلسه</label><input id="sessionTopic" placeholder="مثلاً مقدمه رگرسیون"></div>
 </div><div class="actions" style="margin-top:18px"><button class="primary" onclick="addSession('${courseId}')">✅ ایجاد جلسه</button><button onclick="closeModal()">❌ انصراف</button></div>`)
}

function addSession(courseId){
 const date = document.getElementById('sessionDate').value.trim();
 const title = document.getElementById('sessionTitle').value.trim();
 const topic = document.getElementById('sessionTopic').value.trim();
 
 if(!date) { alert('⚠️ لطفاً تاریخ را انتخاب کنید.'); return; }
 if(!title) { alert('⚠️ لطفاً عنوان جلسه را وارد کنید.'); return; }
 
 const id = genId();
 db.sessions.push({ id: id, courseId: courseId, date: date, title: title, topic: topic || '' });
 
 db.students.filter(s => s.courseId === courseId).forEach(s => {
  db.attendance.push({ session: id, courseId: courseId, studentId: s.id, status: 'present' });
 });
 
 save();
 closeModal();
 courseSessions(courseId);
}

function openSession(sessionId){
 const s=db.sessions.find(x=>x.id===sessionId);
 if(!s) return;
 attendanceBySession(s);
}

// ============== حضور و نمره (با input text و کیبورد عددی) ==============
function attendanceBySession(s){
 const course=db.courses.find(c=>c.id===s.courseId), list=db.students.filter(x=>x.courseId===s.courseId);
 document.getElementById('main').innerHTML=`<div class="top"><div><h1>${esc(s.title)}</h1><div class="muted">📅 ${formatJalali(s.date)} — ${esc(s.topic||'')}</div></div><div class="actions"><button class="secondary" onclick="setAllSessionAttendance('${s.id}','${s.courseId}','present')">✅ همه حاضر</button><button class="secondary" onclick="sessionScores('${s.courseId}','${s.id}')">📊 نمره جلسه</button><button class="primary" onclick="courseSessions('${s.courseId}')">🔙 بازگشت به جلسات</button></div></div>
 <div class="panel"><table><thead><tr><th>دانشجو</th><th>وضعیت</th><th>نمره</th></tr></thead><tbody>${list.map(st=>{const a=db.attendance.find(x=>x.session===s.id&&x.studentId===st.id);const g=db.sessionScores.find(x=>x.session===s.id&&x.studentId===st.id);return `<tr><td>${esc(st.name)}</td><td><select onchange="setAttendanceStatus('${s.id}','${st.id}',this.value)"><option value="present" ${a?.status==='present'?'selected':''}>✅ حاضر</option><option value="absent" ${a?.status==='absent'?'selected':''}>❌ غایب</option><option value="late" ${a?.status==='late'?'selected':''}>⏰ تأخیر</option></select></td><td><input type="text" inputmode="decimal" value="${g?.score??0}" oninput="setSessionScoreAuto('${s.id}','${st.id}',this.value)" class="score-input"></td></tr>`}).join('')}</tbody></table></div>
 <div class="muted" style="margin-top:8px;font-size:13px">💡 با کیبورد عدد وارد کنید. هر عددی مثل ۱۹.۳۴، ۱۷.۵، ۲۰ قابل قبول است.</div>`;
}

function setSessionScoreAuto(session,studentId,value){
 let g=db.sessionScores.find(x=>x.session===session&&x.studentId===studentId);
 if(!g){g={session,studentId,score:0};db.sessionScores.push(g)}
 const val=parseFloat(value);
 if(!isNaN(val)) {
  g.score=val;
  save();
 }
}

function setAttendanceStatus(session,sid,status){
 let a=db.attendance.find(x=>x.session===session&&x.studentId===sid);
 if(a){ a.status=status; save(); }
}

function setAllSessionAttendance(sessionId,courseId,status){
 db.attendance.filter(a=>a.session===sessionId&&a.courseId===courseId).forEach(a=>a.status=status);
 save();
 const s=db.sessions.find(s=>s.id===sessionId);
 if(s) attendanceBySession(s);
}

// ============== نمره جلسه در مودال (با input text و کیبورد عددی) ==============
function sessionScores(courseId,session){
 const course=db.courses.find(c=>c.id===courseId), list=db.students.filter(s=>s.courseId===courseId);
 modal(`<h2>📊 نمره جلسه — ${esc(course?.name||'')}</h2>
 <div class="muted" style="margin-bottom:12px">با کیبورد عدد وارد کنید (مثل ۱۹.۳۴، ۱۷.۵، ۲۰، ۱۵.۷۵)</div>
 <div class="actions" style="margin-bottom:12px"><button class="secondary" onclick="setAllSessionScores('${courseId}','${session}',0)">همه ۰</button><button class="secondary" onclick="setAllSessionScores('${courseId}','${session}',20)">همه ۲۰</button></div>
 <div style="max-height:55vh;overflow:auto"><table><thead><tr><th>دانشجو</th><th>حضور</th><th>نمره</th></tr></thead><tbody>
 ${list.map(s=>{const a=db.attendance.find(x=>x.session===session&&x.studentId===s.id);const g=db.sessionScores.find(x=>x.session===session&&x.studentId===s.id);return `<tr><td>${esc(s.name)}</td><td>${a?.status==='absent'?'❌ غایب':a?.status==='late'?'⏰ تأخیر':'✅ حاضر'}</td><td><input type="text" inputmode="decimal" value="${g?.score??0}" oninput="setSessionScore('${session}','${s.id}',this.value)" class="score-input"></td></tr>`}).join('')}
 </tbody></table></div>
 <div class="actions" style="margin-top:16px"><button class="primary" onclick="save();closeModal();alert('✅ نمرات ذخیره شد.')">✅ ذخیره</button><button onclick="closeModal()">❌ بستن</button></div>`);
}

function setSessionScore(session,studentId,value){
 let g=db.sessionScores.find(x=>x.session===session&&x.studentId===studentId);
 if(!g){g={session,studentId,score:0};db.sessionScores.push(g)}
 const val=parseFloat(value);
 if(!isNaN(val)) g.score=val;
 save();
}

function setAllSessionScores(courseId,session,value){
 db.students.filter(s=>s.courseId===courseId).forEach(s=>{
  let g=db.sessionScores.find(x=>x.session===session&&x.studentId===s.id);
  if(!g){g={session,studentId:s.id,score:0};db.sessionScores.push(g)}
  g.score=value;
 }); save(); sessionScores(courseId,session);
}

// ============== REPORTS ==============
function reportsByCourse(){
 const groups=db.courses.map(c=>{
  const students=db.students.filter(s=>s.courseId===c.id);
  return `<div class="panel"><h2>📖 ${esc(c.name)}</h2><table><thead><tr><th>دانشجو</th><th>شماره</th><th>حضور</th><th>غیبت</th><th>جلسات</th><th>نمره جلسات</th><th>نمره تمرین‌ها</th><th></th></tr></thead><tbody>${students.map(s=>{
   const ses=db.sessions.filter(x=>x.courseId===c.id);
   const pres=ses.filter(se=>db.attendance.find(a=>a.session===se.id&&a.studentId===s.id)?.status==='present').length;
   const abs=ses.filter(se=>db.attendance.find(a=>a.session===se.id&&a.studentId===s.id)?.status==='absent').length;
   const sg=db.sessionScores.filter(g=>g.studentId===s.id).reduce((z,g)=>z+Number(g.score||0),0);
   const ag=db.assignmentScores.filter(g=>g.studentId===s.id).reduce((z,g)=>z+Number(g.score||0),0);
   return `<tr><td>${esc(s.name)}</td><td>${esc(s.sid||'')}</td><td>${pres}</td><td>${abs}</td><td>${ses.length}</td><td>${sg.toFixed(2)}</td><td>${ag.toFixed(2)}</td><td><button class="secondary" onclick="studentRecord('${s.id}')">📋 سوابق</button></td></tr>`
  }).join('')||'<tr><td colspan="8">دانشجویی ثبت نشده است.</td></tr>'}</tbody></table></div>`
 }).join('');
 document.getElementById('main').innerHTML=`<div class="top"><div><h1>📊 گزارش‌ها</h1><div class="muted">دانشجویان به تفکیک درس</div></div></div>${groups||'<div class="empty">درسی ثبت نشده است.</div>'}`;
}

function studentRecord(studentId){
 const s=db.students.find(x=>x.id===studentId), c=db.courses.find(x=>x.id===s.courseId);
 const sessions=db.sessions.filter(x=>x.courseId===s.courseId).sort((a,b)=>a.date.localeCompare(b.date));
 const attendance=sessions.map(se=>({se,a:db.attendance.find(x=>x.session===se.id&&x.studentId===s.id),g:db.sessionScores.find(x=>x.session===se.id&&x.studentId===s.id)}));
 const ass=db.assignments.filter(x=>x.courseId===s.courseId);
 const ag=ass.map(a=>({a,g:db.assignmentScores.find(x=>x.assignmentId===a.id&&x.studentId===s.id)}));
 const totalSession=attendance.reduce((z,x)=>z+Number(x.g?.score||0),0), totalAss=ag.reduce((z,x)=>z+Number(x.g?.score||0),0);
 const present=attendance.filter(x=>x.a?.status==='present').length, absent=attendance.filter(x=>x.a?.status==='absent').length, late=attendance.filter(x=>x.a?.status==='late').length;
 document.getElementById('main').innerHTML=`<div class="top"><div><h1>👤 ${esc(s.name)}</h1><div class="muted">📖 ${esc(c?.name||'')} — شماره ${esc(s.sid||'')}</div></div><button class="primary" onclick="reportsByCourse()">🔙 بازگشت</button></div>
 <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0">
  <div class="card">✅ حضور<div class="number">${present}</div></div>
  <div class="card">❌ غیبت<div class="number">${absent}</div></div>
  <div class="card">⏰ تأخیر<div class="number">${late}</div></div>
  <div class="card">📊 نمره جلسات<div class="number">${totalSession.toFixed(2)}</div></div>
  <div class="card">📝 نمره تمرین‌ها<div class="number">${totalAss.toFixed(2)}</div></div>
 </div>
 <div class="panel"><h3>📅 سوابق جلسات</h3><table><thead><tr><th>تاریخ</th><th>جلسه</th><th>حضور</th><th>نمره</th><th>موضوع</th></tr></thead><tbody>${attendance.map(x=>`<tr><td>${formatJalali(x.se.date)}</td><td>${esc(x.se.title)}</td><td>${x.a?.status==='absent'?'❌ غایب':x.a?.status==='late'?'⏰ تأخیر':'✅ حاضر'}</td><td>${x.g?.score??0}</td><td>${esc(x.se.topic||'')}</td></tr>`).join('')||'<tr><td colspan="5">جلسه‌ای ثبت نشده است.</td></tr>'}</tbody></table></div>
 <div class="panel"><h3>📝 تمرین‌ها</h3><table><thead><tr><th>تمرین</th><th>تاریخ تحویل</th><th>تحویل</th><th>نمره</th></tr></thead><tbody>${ag.map(x=>`<tr><td>${esc(x.a.title)}</td><td>${formatJalali(x.a.dueDate)}</td><td>${x.g?.submitted?'✅ تحویل داده':'❌ نداده'}</td><td>${x.g?.score??0} از ${x.a.max}</td></tr>`).join('')||'<tr><td colspan="4">تمرینی ثبت نشده است.</td></tr>'}</tbody></table></div>`;
}

function backupData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='class_manager_backup.json';a.click();
}

function restoreData(){
 const input=document.createElement('input');input.type='file';input.accept='.json';
 input.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('پشتیبان بازیابی شد.');show('dashboard')}catch(err){alert('فایل پشتیبان معتبر نیست.')}};r.readAsText(f)};input.click();
}

function modal(content){document.getElementById('modalbox').innerHTML=content;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}

show('dashboard');

</script>
</body>
</html>
